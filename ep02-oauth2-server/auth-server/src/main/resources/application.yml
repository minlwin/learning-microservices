server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auth-server

  # Defaults for running the application on the host with Docker Compose services.
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/wallet_demo?currentSchema=auth}
    username: ${AUTH_DB_USERNAME:authuser}
    password: ${AUTH_DB_PASSWORD:authpass}

  jpa:
    open-in-view: false
    hibernate:
      # Tables are managed explicitly by the SQL scripts in /postgres.
      ddl-auto: validate
    properties:
      "[hibernate.default_schema]": auth

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "[mail.smtp.auth]": ${MAIL_SMTP_AUTH:false}
      "[mail.smtp.starttls.enable]": ${MAIL_SMTP_STARTTLS_ENABLE:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:auth-server}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Event payloads are strings (including JSON text) until event DTOs are defined.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        "[enable.idempotence]": true

app:
  kafka:
    outbox:
      fixed-delay: ${KAFKA_OUTBOX_FIXED_DELAY:1000}
    pin-lock:
      topic: ${PIN_LOCK_SETTING_TOPIC:pin-lock-setting-changed.v1}
      activity-topic: ${PIN_LOCK_ACTIVITY_TOPIC:pin-lock-activity-changed.v1}
      consumer-group-id: ${PIN_LOCK_SETTING_CONSUMER_GROUP:auth-server-pin-lock-settings}
    consumer-account:
      approved-topic: ${CONSUMER_ACCOUNT_APPROVED_TOPIC:consumer-account-approved.v1}
      approved-group-id: ${CONSUMER_ACCOUNT_APPROVED_GROUP:auth-server-consumer-account-approvals}
      rejected-topic: ${CONSUMER_ACCOUNT_REJECTED_TOPIC:consumer-account-rejected.v1}
      rejected-group-id: ${CONSUMER_ACCOUNT_REJECTED_GROUP:auth-server-consumer-account-rejections}
  auth:
    consumer-invitation-url: ${CONSUMER_INVITATION_URL:http://localhost:3000/consumer/registration/{id}}
    consumer-invitation-lifetime: ${CONSUMER_INVITATION_LIFETIME:7d}
    systems:
      Consumer:
        roles: [Consumer]
      Management:
        roles: [Management, Administrator]
    registration:
      system: Consumer
      role: Consumer
      client-id: consumer-demo
    activation:
      system: Management
      role: Management
    resources:
      consumer-service:
        secret: ${CONSUMER_RESOURCE_SECRET:consumer-resource-secret}
        email-check-systems: [Consumer]
        pin-lock-systems: [Consumer]
        audiences: [consumer.api, management.api]
      management-service:
        secret: ${MANAGEMENT_RESOURCE_SECRET:management-resource-secret}
        email-check-systems: [Consumer, Management]
        pin-lock-systems: [Consumer, Management]
        audiences: [management.api]
    issuer: ${AUTH_ISSUER:http://localhost:8080}
    ticket-lifetime-seconds: 60
    access-token-time-to-live: ${ACCESS_TOKEN_TIME_TO_LIVE:10m}
    refresh-token-time-to-live: ${REFRESH_TOKEN_TIME_TO_LIVE:8h}
    clients:
      consumer-demo:
        system: Consumer
        scopes: [consumer.api, consumer.onboarding]
        audiences: [consumer.api]
        secret: ${CONSUMER_CLIENT_SECRET:consumer-demo-secret}
      management-demo:
        system: Management
        scopes: [management.api]
        audiences: [management.api]
        secret: ${MANAGEMENT_CLIENT_SECRET:management-demo-secret}
  mail:
    from: ${MAIL_FROM:no-reply@wallet-demo.local}
  otp:
    expiration:
      registration: 3
      activation: 5
    resend:
      interval-seconds: 60
    cooldown:
      missing-count: 3
      waiting-duration: 30
  administrator:
    system: Management
    role: Administrator
    username: ${ADMINISTRATOR_USERNAME:admin@example.com}
    password: ${ADMINISTRATOR_PASSWORD:password}
