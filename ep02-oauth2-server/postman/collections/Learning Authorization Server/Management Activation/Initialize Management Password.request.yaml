---
"$kind": http-request
url: "{{AUTH_SERVER}}/api/activate/{{MANAGEMENT_ACTIVATION_ID}}/initialize"
method: POST
body:
  type: json
  content: |-
    {
      "password": "{{MANAGEMENT_PASSWORD}}"
    }
headers:
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('HTTP request succeeded', function () { pm.expect(pm.response.code).to.be.within(200, 299); });
    const data = pm.response.json(); if (data.id) { pm.environment.set('MANAGEMENT_PROFILE_ID', data.id); }
order: 4000
