---
"$kind": http-request
url: "{{MANAGEMENT_SERVICE}}/api/setting/pin-locks/{{PIN_LOCK_SYSTEM}}"
method: POST
auth:
  type: bearer
  credentials:
  - key: token
    value: "{{MANAGEMENT_ACCESS_TOKEN}}"
body:
  type: json
  content: |-
    {
      "tempLockFailsCount": 3,
      "tempLockWaitMinutes": 15,
      "permanentLockFailsCount": 9
    }
headers:
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('HTTP request succeeded', function () { pm.expect(pm.response.code).to.be.within(200, 299); });
order: 9000
