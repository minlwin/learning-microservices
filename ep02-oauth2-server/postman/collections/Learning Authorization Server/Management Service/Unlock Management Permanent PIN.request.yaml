---
"$kind": http-request
url: "{{MANAGEMENT_SERVICE}}/api/accounts/pin-lock/{{MANAGEMENT_ACCOUNT_ID}}/unlock"
method: PUT
auth:
  type: bearer
  credentials:
  - key: token
    value: "{{MANAGEMENT_ACCESS_TOKEN}}"
body:
  type: none
scripts:
- type: afterResponse
  language: text/javascript
  code: pm.test('HTTP request succeeded', function () { pm.expect(pm.response.code).to.be.within(200, 299); });
order: 5000
