---
"$kind": http-request
url: "{{AUTH_SERVER}}/api/internal/profiles/email/check"
method: POST
auth:
  type: basic
  credentials:
  - key: username
    value: "{{MANAGEMENT_RESOURCE_ID}}"
  - key: password
    value: "{{MANAGEMENT_RESOURCE_SECRET}}"
body:
  type: json
  content: |-
    {
      "system": "Management",
      "email": "{{MANAGEMENT_EMAIL}}"
    }
headers:
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('HTTP request succeeded', function () { pm.expect(pm.response.code).to.be.within(200, 299); });
    pm.expect(pm.response.json()).to.have.property('profileExists');
order: 2000
