$kind: http-request
url: "{{AUTH_SERVER}}/api/registration"
method: POST
body:
  type: json
  content: |-
    {
        "email" : "consumer@example.com"   
    }
scripts:
  - type: afterResponse
    code: |
      pm.collectionVariables.set("self_registration_id", pm.response.json().key);
    language: text/javascript
order: 1000
