---
"$kind": http-request
url: "{{AUTH_SERVER}}/api/registration/{{SELF_REGISTRATION_ID}}/initialize"
method: POST
body:
  type: json
  content: |-
    {
      "password": "{{CONSUMER_PASSWORD}}"
    }
headers:
- key: Content-Type
  value: application/json
scripts:
- type: afterResponse
  language: text/javascript
  code: |-
    pm.test('HTTP request succeeded', function () { pm.expect(pm.response.code).to.be.within(200, 299); });
    const data = pm.response.json(); if (data.loginTicket) { pm.environment.set('CONSUMER_LOGIN_TICKET', data.loginTicket); } if (data.id) { pm.environment.set('CONSUMER_PROFILE_ID', data.id); }
order: 4000
