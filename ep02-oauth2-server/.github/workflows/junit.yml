name: Authorization Server JUnit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  junit:
    name: JUnit tests (ep02-oauth2-server)
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ep02-oauth2-server

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: ep02-oauth2-server/**/pom.xml

      - name: Run JUnit tests in all Maven modules
        run: >-
          mvn --batch-mode --no-transfer-progress --fail-at-end
          -DskipTests=false -Dmaven.test.skip=false
          -Dmaven.test.failure.ignore=false clean test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: ep02-oauth2-server/**/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
