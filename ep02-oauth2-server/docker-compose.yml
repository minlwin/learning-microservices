services:
  postgres:
    image: postgres:17
    container_name: wallet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wallet_demo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wallet_demo"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    container_name: wallet-kafka
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: wallet-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  auth-server:
    build:
      context: .
      dockerfile: auth-server/Dockerfile
    image: learning-auth-server:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SERVER_PORT: 8080
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/wallet_demo?currentSchema=auth
      AUTH_DB_USERNAME: authuser
      AUTH_DB_PASSWORD: authpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      AUTH_ISSUER: ${AUTH_ISSUER:-http://auth-server:8080}
      ADMINISTRATOR_USERNAME: ${ADMINISTRATOR_USERNAME:-admin@example.com}
      ADMINISTRATOR_PASSWORD: ${ADMINISTRATOR_PASSWORD:-ChangeThisLocalAdminPassword1}
      CONSUMER_CLIENT_SECRET: ${CONSUMER_CLIENT_SECRET:-consumer-demo-secret}
      MANAGEMENT_CLIENT_SECRET: ${MANAGEMENT_CLIENT_SECRET:-management-demo-secret}
      CONSUMER_RESOURCE_SECRET: ${CONSUMER_RESOURCE_SECRET:-consumer-resource-secret}
      MANAGEMENT_RESOURCE_SECRET: ${MANAGEMENT_RESOURCE_SECRET:-management-resource-secret}
      CONSUMER_INVITATION_URL: ${CONSUMER_INVITATION_URL:-http://localhost:3000/consumer/registration/{id}}
      MANAGEMENT_ACTIVATION_URL: ${MANAGEMENT_ACTIVATION_URL:-http://localhost:3000/management/activation/{id}}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - auth_signing_keys:/home/app/.wallet-demo

  consumer-service:
    build:
      context: .
      dockerfile: consumer-service/Dockerfile
    image: learning-consumer-service:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-server:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      CONSUMER_DB_URL: jdbc:postgresql://postgres:5432/wallet_demo?currentSchema=consumer
      CONSUMER_DB_USERNAME: csmuser
      CONSUMER_DB_PASSWORD: csmpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_INTROSPECTION_URI: http://auth-server:8080/api/internal/tokens/introspect
      AUTH_PIN_LOCK_UNLOCK_URI: http://auth-server:8080/api/internal/pin-locks/unlock
      AUTH_EMAIL_CHECK_URI: http://auth-server:8080/api/internal/profiles/email/check
      AUTH_ISSUER: ${AUTH_ISSUER:-http://auth-server:8080}
      CONSUMER_RESOURCE_SECRET: ${CONSUMER_RESOURCE_SECRET:-consumer-resource-secret}
    ports:
      - "127.0.0.1:8081:8081"

  management-service:
    build:
      context: .
      dockerfile: management-service/Dockerfile
    image: learning-management-service:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      auth-server:
        condition: service_started
    environment:
      SERVER_PORT: 8082
      MANAGEMENT_DB_URL: jdbc:postgresql://postgres:5432/wallet_demo?currentSchema=management
      MANAGEMENT_DB_USERNAME: mnguser
      MANAGEMENT_DB_PASSWORD: mngpass
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AUTH_INTROSPECTION_URI: http://auth-server:8080/api/internal/tokens/introspect
      AUTH_EMAIL_CHECK_URI: http://auth-server:8080/api/internal/profiles/email/check
      AUTH_PIN_LOCK_UNLOCK_URI: http://auth-server:8080/api/internal/pin-locks/unlock
      AUTH_ISSUER: ${AUTH_ISSUER:-http://auth-server:8080}
      MANAGEMENT_RESOURCE_SECRET: ${MANAGEMENT_RESOURCE_SECRET:-management-resource-secret}
    ports:
      - "127.0.0.1:8082:8082"

volumes:
  postgres_data:
  kafka_data:
  auth_signing_keys:
